<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ads Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c12;--surface:#0e1420;--border:#1c2840;
  --text:#dde4f0;--muted:#4a5878;--accent:#3d7fff;
  --green:#2ecc71;--red:#e74c3c;--amber:#f39c12;
  --font:"IBM Plex Sans",sans-serif;--mono:"IBM Plex Mono",monospace
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;min-height:100vh}
#app{padding:20px;max-width:1400px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.logo{font-family:var(--mono);font-size:14px;font-weight:500;color:#fff;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:4px 10px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.badge-brl{background:#0a2e1a;border:1px solid #1a5c34;border-radius:5px;padding:4px 10px;font-size:11px;color:#2ecc71;font-family:var(--mono)}
.btn-reset{background:transparent;border:1px solid #e74c3c44;border-radius:5px;padding:4px 12px;font-size:11px;color:#e74c3c;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:#e74c3c22}
.btn-history{background:transparent;border:1px solid #3d7fff66;border-radius:5px;padding:4px 12px;font-size:11px;color:#3d7fff;cursor:pointer;transition:all .15s}
.btn-history:hover{background:#3d7fff22}
.filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.fs{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--text);width:100%;outline:none;cursor:pointer}
.fs:focus{border-color:var(--accent)}
.sw{position:relative}
.si{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--text);width:100%;outline:none}
.si:focus{border-color:var(--accent)}
.dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#111827;border:1px solid var(--accent);border-radius:7px;max-height:200px;overflow-y:auto;z-index:200;display:none;box-shadow:0 8px 24px #00000066}
.dd.open{display:block}
.di{padding:8px 11px;font-size:12px;color:#94a3b8;cursor:pointer;border-bottom:1px solid var(--border)}
.di:last-child{border-bottom:none}
.di:hover,.di.sel{background:#1d3a5f;color:#bfdbfe}
.date-range{display:flex;gap:6px;align-items:center}
.date-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--text);font-family:var(--mono);flex:1;outline:none;min-width:0}
.date-input:focus{border-color:var(--accent)}
.date-sep{color:var(--muted);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--border)}
.card.spend::before{background:var(--accent)}
.card.rev::before{background:var(--green)}
.card.profit::before{background:var(--green)}
.card.profit.neg::before{background:var(--red)}
.card.roas::before{background:var(--amber)}
.clabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);margin-bottom:6px}
.cval{font-size:19px;font-weight:500;font-family:var(--mono);color:#fff}
.cval.b{color:#60a5fa}.cval.g{color:var(--green)}.cval.r{color:var(--red)}.cval.a{color:var(--amber)}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.stitle{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:540px){.row2{grid-template-columns:1fr}}
.leg{display:flex;gap:14px;margin-bottom:10px;font-size:11px;color:var(--muted)}
.ld{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:11px}
th{color:var(--muted);font-weight:400;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);white-space:nowrap}
tr{border-bottom:1px solid #0d1420}
tr:hover td{background:#111d30}
td{padding:8px;color:#94a3b8;white-space:nowrap;font-family:var(--mono);font-size:11px}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500}
.pg{background:#0a2e1a;color:#2ecc71;border:1px solid #1a5c34}
.pr{background:#2d0e0e;color:#e74c3c;border:1px solid #5c1a1a}
.py{background:#2d2206;color:#f39c12;border:1px solid #5c4410}
.empty{text-align:center;padding:32px;color:var(--muted);font-size:13px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:12px;color:var(--muted)}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.errmsg{padding:32px;color:#e74c3c;font-family:var(--mono);font-size:12px;background:#2d0e0e22;border:1px solid #5c1a1a;border-radius:10px;margin:20px}

/* ── Modal histórico ── */
.modal-overlay{position:fixed;inset:0;background:#000000cc;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#0e1420;border:1px solid var(--border);border-radius:14px;width:100%;max-width:860px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-family:var(--mono);font-size:14px;color:#fff;font-weight:500}
.modal-close{background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.modal-close:hover{border-color:#e74c3c;color:#e74c3c}
.modal-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:18px}
.hist-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.hist-filter span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.hist-filter select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--text);outline:none}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    <span>Carregando dados...</span>
  </div>
</div>

<!-- Modal histórico mensal -->
<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">📅 Histórico mensal</span>
      <button class="modal-close" onclick="closeHistoryModal()">✕ fechar</button>
    </div>
    <div id="modalContent">
      <div class="loading"><div class="spinner"></div><span>Carregando histórico...</span></div>
    </div>
  </div>
</div>

<template id="tmplShell">
  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>ADS DASHBOARD</div>
    <div class="topbar-right">
      <span class="badge-brl" id="cotacaobadge">USD/BRL —</span>
      <span class="badge" id="lastup">—</span>
      <button class="btn-history" onclick="openHistoryModal()">📅 Histórico</button>
      <button class="btn-reset" onclick="resetFilters()">limpar filtros</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="fg">
      <span class="fl">Período</span>
      <select class="fs" id="fPeriod" onchange="onPeriodChange()">
        <option value="today">Hoje</option>
        <option value="yesterday">Ontem</option>
        <option value="7">Últimos 7 dias</option>
        <option value="14">Últimos 14 dias</option>
        <option value="30" selected>Últimos 30 dias</option>
        <option value="all">Tudo</option>
        <option value="custom">Personalizado...</option>
      </select>
    </div>
    <div class="fg" id="customDateGroup" style="display:none">
      <span class="fl">Intervalo</span>
      <div class="date-range">
        <input type="date" class="date-input" id="dateFrom" onchange="render()">
        <span class="date-sep">→</span>
        <input type="date" class="date-input" id="dateTo" onchange="render()">
      </div>
    </div>
    <div class="fg">
      <span class="fl">Campanha</span>
      <div class="sw">
        <input class="si" id="fCampInput" placeholder="Buscar campanha..." autocomplete="off">
        <div class="dd" id="dropCamp"></div>
      </div>
    </div>
    <div class="fg">
      <span class="fl">Produto</span>
      <div class="sw">
        <input class="si" id="fProdInput" placeholder="Buscar produto..." autocomplete="off">
        <div class="dd" id="dropProd"></div>
      </div>
    </div>
    <div class="fg">
      <span class="fl">Status</span>
      <select class="fs" id="fStatus" onchange="render()">
        <option value="all">Todos</option>
        <option value="profit">Lucro</option>
        <option value="loss">Prejuízo</option>
        <option value="nosales">Sem vendas</option>
      </select>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="row2">
    <div class="sec">
      <div class="stitle">Gasto vs receita</div>
      <div class="leg">
        <span><span class="ld" style="background:#1d4ed8"></span>Gasto (R$)</span>
        <span><span class="ld" style="background:#15803d"></span>Receita (R$)</span>
      </div>
      <div style="position:relative;height:170px"><canvas id="bc"></canvas></div>
    </div>
    <div class="sec">
      <div class="stitle">Lucro por campanha (R$)</div>
      <div style="position:relative;height:170px"><canvas id="pc"></canvas></div>
    </div>
  </div>

  <div class="sec">
    <div class="stitle">Gasto diário (R$)</div>
    <div style="position:relative;height:120px"><canvas id="lc"></canvas></div>
  </div>

  <div class="sec">
    <div class="stitle">Detalhamento por campanha</div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Campanha</th><th>Produto</th>
            <th>Gasto R$</th><th>Receita R$</th><th>Lucro R$</th>
            <th>Vendas</th><th>ROAS</th><th>ROI</th><th>CPA R$</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</template>

<script>
var COLORS = ["#3d7fff","#9b59b6","#e67e22","#2ecc71","#e91e8c","#00bcd4","#f1c40f","#e74c3c","#1abc9c","#ff5722"];
var campColorMap = {};
var selCamp = "all", selProd = "all";
var AD = [], SL = [];
var COTACAO = 1;
var bChart, pChart, lChart, hChart;
var historyLoaded = false;

// ── Formatação ────────────────────────────────────────────
function fmtBRL(n)  { return "R$ " + n.toFixed(2).replace(".", ","); }
function fmtBRLk(n) { return n >= 1000 ? "R$ " + (n / 1000).toFixed(1) + "k" : "R$ " + Math.round(n); }

// ── Busca cotação ─────────────────────────────────────────
google.script.run
  .withSuccessHandler(function(val) {
    COTACAO = parseFloat(val) || 1;
    var el = document.getElementById("cotacaobadge");
    if (el) el.textContent = "USD/BRL " + COTACAO.toFixed(2);
  })
  .withFailureHandler(function() { COTACAO = 1; })
  .getCotacao();

// ── Carrega dados ─────────────────────────────────────────
google.script.run
  .withSuccessHandler(function(raw) {
    try {
      var d = JSON.parse(raw);
      AD = d.adSpend; SL = d.salesLog;
      var allCamps = [], allProds = [];
      AD.forEach(function(r) {
        if (allCamps.indexOf(r.campaign) === -1) allCamps.push(r.campaign);
        var p = r.product || "(sem produto)";
        if (allProds.indexOf(p) === -1) allProds.push(p);
      });
      allCamps.forEach(function(c, i) { campColorMap[c] = COLORS[i % COLORS.length]; });

      var tmpl  = document.getElementById("tmplShell");
      var clone = document.importNode(tmpl.content, true);
      document.getElementById("app").innerHTML = "";
      document.getElementById("app").appendChild(clone);

      var cb = document.getElementById("cotacaobadge");
      if (cb) cb.textContent = "USD/BRL " + COTACAO.toFixed(2);

      buildDropdown("camp", allCamps);
      buildDropdown("prod", allProds);
      render();
    } catch(e) {
      document.getElementById("app").innerHTML =
        '<div class="errmsg"><b>Erro ao processar dados:</b><br><br>' + e.toString() + '</div>';
    }
  })
  .withFailureHandler(function(err) {
    document.getElementById("app").innerHTML =
      '<div class="errmsg"><b>Erro ao carregar dados:</b><br><br>' +
      (err && err.message ? err.message : JSON.stringify(err)) + '</div>';
  })
  .getData();

// ── Modal histórico ───────────────────────────────────────
function openHistoryModal() {
  document.getElementById("modalOverlay").style.display = "flex";
  if (!historyLoaded) {
    google.script.run
      .withSuccessHandler(function(raw) {
        historyLoaded = true;
        renderHistory(JSON.parse(raw));
      })
      .withFailureHandler(function(err) {
        document.getElementById("modalContent").innerHTML =
          '<div class="errmsg">Erro ao carregar histórico: ' + (err && err.message ? err.message : "") + '</div>';
      })
      .getSnapshots();
  }
}

function closeHistoryModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

function closeModal(e) {
  if (e.target === document.getElementById("modalOverlay")) closeHistoryModal();
}

function renderHistory(rows) {
  if (!rows || rows.length === 0) {
    document.getElementById("modalContent").innerHTML =
      '<div class="empty">Nenhum snapshot ainda.<br><br>O primeiro será salvo automaticamente no dia 1º do próximo mês.</div>';
    return;
  }

  // Ordena por mês crescente
  rows.sort(function(a, b) { return a.month.localeCompare(b.month); });

  // Totais acumulados
  var totalSpend   = rows.reduce(function(s, r) { return s + r.spend; }, 0);
  var totalRevBRL  = rows.reduce(function(s, r) { return s + r.revenue_brl; }, 0);
  var totalProfit  = totalRevBRL - totalSpend;
  var totalSales   = rows.reduce(function(s, r) { return s + r.sales; }, 0);
  var overallROAS  = totalSpend > 0 ? totalRevBRL / totalSpend : 0;

  var html =
    '<div class="modal-cards">' +
    '<div class="card spend"><div class="clabel">Gasto total</div><div class="cval b">' + fmtBRLk(totalSpend) + '</div></div>' +
    '<div class="card rev"><div class="clabel">Receita total</div><div class="cval g">' + fmtBRLk(totalRevBRL) + '</div></div>' +
    '<div class="card profit' + (totalProfit < 0 ? " neg" : "") + '"><div class="clabel">Lucro total</div><div class="cval ' + (totalProfit >= 0 ? "g" : "r") + '">' + fmtBRLk(totalProfit) + '</div></div>' +
    '<div class="card roas"><div class="clabel">ROAS médio</div><div class="cval a">' + overallROAS.toFixed(2) + 'x</div></div>' +
    '<div class="card"><div class="clabel">Vendas total</div><div class="cval">' + totalSales + '</div></div>' +
    '</div>';

  // Gráfico de barras
  html += '<div class="sec" style="margin-bottom:14px">' +
    '<div class="stitle">Gasto vs receita por mês</div>' +
    '<div class="leg">' +
    '<span><span class="ld" style="background:#1d4ed8"></span>Gasto R$</span>' +
    '<span><span class="ld" style="background:#15803d"></span>Receita R$</span>' +
    '<span><span class="ld" style="background:#b91c1c"></span>Lucro/Prejuízo R$</span>' +
    '</div>' +
    '<div style="position:relative;height:200px"><canvas id="hChart"></canvas></div>' +
    '</div>';

  // Tabela
  html += '<div class="sec"><div class="stitle">Resumo por mês</div><div style="overflow-x:auto"><table>' +
    '<thead><tr><th>Mês</th><th>Gasto R$</th><th>Receita R$</th><th>Lucro R$</th><th>Vendas</th><th>ROAS</th><th>ROI</th><th>Cotação</th></tr></thead>' +
    '<tbody>';

  rows.slice().reverse().forEach(function(r) {
    var p    = r.revenue_brl - r.spend;
    var roas = r.spend > 0 ? (r.revenue_brl / r.spend).toFixed(2) : "—";
    var roi  = r.spend > 0 ? ((p / r.spend) * 100).toFixed(0) + "%" : "—";
    var st   = p > 0
      ? "<span class='pill pg'>Lucro</span>"
      : p < 0
        ? "<span class='pill pr'>Prejuízo</span>"
        : "<span class='pill py'>Neutro</span>";
    html += "<tr>" +
      "<td style='color:#fff;font-weight:500'>" + r.month + "</td>" +
      "<td style='color:#60a5fa'>" + fmtBRL(r.spend) + "</td>" +
      "<td style='color:#2ecc71'>" + fmtBRL(r.revenue_brl) + "</td>" +
      "<td style='color:" + (p >= 0 ? "#2ecc71" : "#e74c3c") + "'>" + fmtBRL(p) + "</td>" +
      "<td>" + r.sales + "</td>" +
      "<td style='color:#f39c12'>" + roas + "x</td>" +
      "<td>" + roi + "</td>" +
      "<td style='color:#4a5878'>" + r.cotacao.toFixed(2) + "</td>" +
      "</tr>";
  });

  html += '</tbody></table></div></div>';
  document.getElementById("modalContent").innerHTML = html;

  // Renderiza gráfico após inserir no DOM
  var labels  = rows.map(function(r) { return r.month; });
  var spends  = rows.map(function(r) { return +r.spend.toFixed(2); });
  var revs    = rows.map(function(r) { return +r.revenue_brl.toFixed(2); });
  var profits = rows.map(function(r) { return +(r.revenue_brl - r.spend).toFixed(2); });

  if (hChart) hChart.destroy();
  hChart = new Chart(document.getElementById("hChart"), {
    type: "bar",
    data: { labels: labels, datasets: [
      { label: "Gasto R$",   data: spends,  backgroundColor: "#1d4ed8", borderRadius: 3 },
      { label: "Receita R$", data: revs,    backgroundColor: "#15803d", borderRadius: 3 },
      { label: "Lucro R$",   data: profits, backgroundColor: profits.map(function(v) { return v >= 0 ? "#2ecc7166" : "#e74c3c66"; }), borderRadius: 3 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#4a5878", font: { size: 10 } }, grid: { color: "#0d1420" } },
        y: { ticks: { color: "#4a5878", font: { size: 10 }, callback: function(v) { return "R$" + Math.round(v); } }, grid: { color: "#0d1420" } }
      }
    }
  });
}

// ── Período personalizado ─────────────────────────────────
function onPeriodChange() {
  var v  = document.getElementById("fPeriod").value;
  var cg = document.getElementById("customDateGroup");
  if (v === "custom") {
    cg.style.display = "";
    var today = new Date().toISOString().slice(0, 10);
    document.getElementById("dateFrom").value = today;
    document.getElementById("dateTo").value   = today;
  } else { cg.style.display = "none"; }
  render();
}

function getDateRange() {
  var v = document.getElementById("fPeriod").value;
  var now = new Date();
  var today = now.toISOString().slice(0, 10);
  if (v === "today")     return [today, today];
  if (v === "yesterday") { var d = new Date(now); d.setDate(d.getDate()-1); var s = d.toISOString().slice(0,10); return [s,s]; }
  if (v === "all")       return ["0000-00-00","9999-99-99"];
  if (v === "custom")    { var f = document.getElementById("dateFrom").value; var t = document.getElementById("dateTo").value; return [f||today, t||today]; }
  var d2 = new Date(now); d2.setDate(d2.getDate()-parseInt(v));
  return [d2.toISOString().slice(0,10), today];
}

// ── Dropdowns ─────────────────────────────────────────────
function buildDropdown(type, items) {
  var inputId = type === "camp" ? "fCampInput" : "fProdInput";
  var dropId  = type === "camp" ? "dropCamp"   : "dropProd";
  var input = document.getElementById(inputId);
  var drop  = document.getElementById(dropId);
  function populate(filter) {
    drop.innerHTML = "";
    var all = document.createElement("div");
    all.className = "di sel"; all.dataset.val = "all"; all.textContent = "Todos";
    drop.appendChild(all);
    items.forEach(function(item) {
      if (filter && item.toLowerCase().indexOf(filter.toLowerCase()) === -1) return;
      var d = document.createElement("div");
      d.className = "di"; d.dataset.val = item; d.textContent = item;
      drop.appendChild(d);
    });
    drop.querySelectorAll(".di").forEach(function(d) {
      d.addEventListener("mousedown", function(e) {
        e.preventDefault();
        var val = this.dataset.val;
        if (type === "camp") selCamp = val; else selProd = val;
        input.value = val === "all" ? "" : val;
        drop.querySelectorAll(".di").forEach(function(x) { x.classList.remove("sel"); });
        this.classList.add("sel");
        drop.classList.remove("open");
        render();
      });
    });
  }
  populate("");
  input.addEventListener("input",  function() { populate(this.value); drop.classList.add("open"); });
  input.addEventListener("focus",  function() { populate(this.value); drop.classList.add("open"); });
  input.addEventListener("blur",   function() { setTimeout(function() { drop.classList.remove("open"); }, 200); });
}

// ── Agrupamento ───────────────────────────────────────────
function getFiltered() {
  var r = getDateRange();
  return AD.filter(function(s) {
    return s.date >= r[0] && s.date <= r[1] &&
      (selCamp === "all" || s.campaign === selCamp) &&
      (selProd === "all" || (s.product || "(sem produto)") === selProd);
  });
}

function groupCamp(data) {
  var m = {};
  data.forEach(function(r) {
    var k = r.campaign;
    if (!m[k]) m[k] = { camp: k, product: r.product || "—", cid: r.campaign_id, spend: 0, revenue: 0, sales: 0, clicks: 0, impressions: 0 };
    m[k].spend += r.cost;
    m[k].clicks += r.clicks;
    m[k].impressions += r.impressions;
  });
  var dr = getDateRange();
  SL.forEach(function(s) {
    if (s.date < dr[0] || s.date > dr[1]) return;
    if (selProd !== "all" && (s.product || "") !== selProd) return;
    var key = null;
    Object.keys(m).forEach(function(k) { if (m[k].cid === s.campaign_id) key = k; });
    if (key) { m[key].revenue += s.amount; m[key].sales++; }
  });
  return Object.values(m);
}

function groupDate(data) {
  var m = {};
  data.forEach(function(r) {
    if (!m[r.date]) m[r.date] = { date: r.date, spend: 0 };
    m[r.date].spend += r.cost;
  });
  return Object.values(m).sort(function(a, b) { return a.date.localeCompare(b.date); });
}

function applyStatus(bc) {
  var st = document.getElementById("fStatus").value;
  if (st === "all") return bc;
  return bc.filter(function(r) {
    var p = (r.revenue * COTACAO) - r.spend;
    if (st === "profit")  return p > 0;
    if (st === "loss")    return p < 0;
    if (st === "nosales") return r.sales === 0;
    return true;
  });
}

// ── Render principal ──────────────────────────────────────
function render() {
  if (!document.getElementById("cards")) return;
  var data = getFiltered();
  var bc   = applyStatus(groupCamp(data));
  var bd   = groupDate(data);

  var ts  = bc.reduce(function(s, r) { return s + r.spend; }, 0);
  var tr  = bc.reduce(function(s, r) { return s + r.revenue * COTACAO; }, 0);
  var tsl = bc.reduce(function(s, r) { return s + r.sales; }, 0);
  var tc  = bc.reduce(function(s, r) { return s + r.clicks; }, 0);
  var tp  = tr - ts;
  var roas = ts > 0 ? tr / ts : 0;
  var cpa  = tsl > 0 ? ts / tsl : 0;

  document.getElementById("cards").innerHTML =
    '<div class="card spend"><div class="clabel">Gasto</div><div class="cval b">'  + fmtBRLk(ts) + '</div></div>' +
    '<div class="card rev"><div class="clabel">Receita</div><div class="cval g">'  + fmtBRLk(tr) + '</div></div>' +
    '<div class="card profit'+(tp<0?" neg":"")+'"><div class="clabel">Lucro</div><div class="cval '+(tp>=0?"g":"r")+'">'+ fmtBRLk(tp) +'</div></div>' +
    '<div class="card roas"><div class="clabel">ROAS</div><div class="cval a">'    + roas.toFixed(2) + 'x</div></div>' +
    '<div class="card"><div class="clabel">Vendas</div><div class="cval">'         + tsl + '</div></div>' +
    '<div class="card"><div class="clabel">CPA</div><div class="cval">'            + (tsl > 0 ? fmtBRLk(cpa) : "—") + '</div></div>' +
    '<div class="card"><div class="clabel">Cliques</div><div class="cval">'        + tc.toLocaleString() + '</div></div>';

  document.getElementById("lastup").textContent =
    "Atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

  var cb = document.getElementById("cotacaobadge");
  if (cb) cb.textContent = "USD/BRL " + COTACAO.toFixed(2);

  var labels  = bc.map(function(r) { return r.camp.split(" ").slice(0,2).join(" "); });
  var spends  = bc.map(function(r) { return +r.spend.toFixed(2); });
  var revsBRL = bc.map(function(r) { return +(r.revenue * COTACAO).toFixed(2); });
  var profs   = bc.map(function(r) { return +((r.revenue * COTACAO) - r.spend).toFixed(2); });

  var chartOpts = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: "#4a5878", font: { size: 10 } }, grid: { color: "#0d1420" } },
      y: { ticks: { color: "#4a5878", font: { size: 10 }, callback: function(v) { return "R$"+Math.round(v); } }, grid: { color: "#0d1420" } }
    }
  };

  if (bChart) bChart.destroy();
  bChart = new Chart(document.getElementById("bc"), { type:"bar", data:{ labels:labels, datasets:[
    { label:"Gasto R$",   data:spends,  backgroundColor:"#1d4ed8", borderRadius:3 },
    { label:"Receita R$", data:revsBRL, backgroundColor:"#15803d", borderRadius:3 }
  ]}, options:chartOpts });

  if (pChart) pChart.destroy();
  pChart = new Chart(document.getElementById("pc"), { type:"bar", data:{ labels:labels, datasets:[{
    label:"Lucro R$", data:profs,
    backgroundColor:profs.map(function(v){return v>=0?"#15803d":"#b91c1c";}), borderRadius:3
  }]}, options:chartOpts });

  var dlabels = bd.map(function(r){return r.date.slice(5);});
  var dspends = bd.map(function(r){return +r.spend.toFixed(2);});
  if (lChart) lChart.destroy();
  lChart = new Chart(document.getElementById("lc"), { type:"line", data:{ labels:dlabels, datasets:[{
    label:"Gasto R$", data:dspends, borderColor:"#3d7fff", backgroundColor:"rgba(61,127,255,0.07)",
    fill:true, tension:0.4, pointRadius:3, pointBackgroundColor:"#3d7fff"
  }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
    scales:{
      x:{ticks:{color:"#4a5878",font:{size:10},maxRotation:0,autoSkip:true},grid:{color:"#0d1420"}},
      y:{ticks:{color:"#4a5878",font:{size:10},callback:function(v){return"R$"+Math.round(v);}},grid:{color:"#0d1420"}}
    }
  }});

  var tbody = document.getElementById("tb");
  if (bc.length === 0) { tbody.innerHTML='<tr><td colspan="10" class="empty">Nenhum resultado</td></tr>'; return; }
  tbody.innerHTML = bc.sort(function(a,b){return b.spend-a.spend;}).map(function(r) {
    var revBRL = r.revenue * COTACAO;
    var p      = revBRL - r.spend;
    var roas   = r.spend > 0 ? (revBRL / r.spend).toFixed(2) : "—";
    var roi    = r.spend > 0 ? ((p / r.spend)*100).toFixed(0)+"%" : "—";
    var cpa    = r.sales > 0 ? fmtBRL(r.spend / r.sales) : "—";
    var st     = p>0?"<span class='pill pg'>Lucro</span>":p<0?"<span class='pill pr'>Prejuízo</span>":"<span class='pill py'>Sem vendas</span>";
    var dot    = "<span style='display:inline-block;width:6px;height:6px;border-radius:50%;background:"+campColorMap[r.camp]+";margin-right:6px;vertical-align:middle'></span>";
    return "<tr><td>"+dot+r.camp.split(" ").slice(0,3).join(" ")+"</td>"+
      "<td style='color:#4a5878'>"+r.product+"</td>"+
      "<td style='color:#60a5fa'>"+fmtBRL(r.spend)+"</td>"+
      "<td style='color:#2ecc71'>"+fmtBRL(revBRL)+"</td>"+
      "<td style='color:"+(p>=0?"#2ecc71":"#e74c3c")+"'>"+fmtBRL(p)+"</td>"+
      "<td>"+r.sales+"</td>"+
      "<td style='color:#f39c12'>"+roas+"x</td>"+
      "<td>"+roi+"</td><td>"+cpa+"</td><td>"+st+"</td></tr>";
  }).join("");
}

function resetFilters() {
  selCamp="all"; selProd="all";
  document.getElementById("fCampInput").value="";
  document.getElementById("fProdInput").value="";
  document.getElementById("fPeriod").value="30";
  document.getElementById("fStatus").value="all";
  document.getElementById("customDateGroup").style.display="none";
  document.querySelectorAll(".di").forEach(function(d){d.classList.remove("sel");if(d.dataset.val==="all")d.classList.add("sel");});
  render();
}
</script>
